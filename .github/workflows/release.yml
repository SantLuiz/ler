name: Publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match package.json version.' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must exist.' }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned technical manual
        shell: pwsh
        env:
          MANUAL_BASE_REF: ${{ inputs.tag || github.ref }}
        run: |
          python -m pip install reportlab Pillow pypdf pdfplumber pypdfium2 matplotlib
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare PDF build dependencies.' }
          bun scripts/manual/snapshot.ts
          if ($LASTEXITCODE -ne 0) { throw 'Could not snapshot manual sources.' }
          bun scripts/manual/capture.tsx
          if ($LASTEXITCODE -ne 0) { throw 'Could not capture manual screens.' }
          python scripts/manual/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not build technical manual.' }
          python scripts/manual/qa.py
          if ($LASTEXITCODE -ne 0) { throw 'Technical manual failed layout or link validation.' }
      - name: Build installer and portable ZIP
        shell: powershell
        run: .\scripts\build-release.ps1 -DownloadCompiler
      - name: Validate extracted portable ZIP
        timeout-minutes: 3
        shell: powershell
        run: .\scripts\test-portable.ps1 -TestUserPath
      - name: Build validation installer with separate AppId
        timeout-minutes: 5
        shell: powershell
        run: .\scripts\build-release.ps1 -ValidationBuild
      - name: Validate Portuguese installation and removal
        timeout-minutes: 3
        shell: powershell
        run: .\scripts\test-installer.ps1
      - name: Validate English installation and removal
        timeout-minutes: 3
        shell: powershell
        run: .\scripts\test-installer.ps1 -Language english
      - name: Preserve installer validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-logs
          path: dist/installer-test-*/*.log
          if-no-files-found: ignore
      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $section = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ')[1].Trim()
          if (-not $section.StartsWith($version + ' ')) { throw 'Latest changelog entry must match the release version.' }
          @(('## ' + $section), '---', (Get-Content scripts/release-readme.en.md -Raw), '---', (Get-Content scripts/release-readme.md -Raw)) | Set-Content dist/release-notes.md -Encoding utf8
      - name: Create draft and upload verified assets
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "LER $env:RELEASE_TAG" --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $draft = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if (-not $draft.isDraft) { throw 'Release is already public; published assets will not be overwritten.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = Get-Item "dist/LER-$version-Setup-x64.exe", "dist/LER-$version-Setup-x64.exe.sha256", "dist/LER-$version-Portable-x64.zip", "dist/LER-$version-Portable-x64.zip.sha256", "output/pdf/LER_por_dentro_Manual_completo_$version.pdf"
          if ($assets.Count -ne 5) { throw 'Expected installer, portable ZIP, both checksums and versioned PDF manual.' }
          gh release upload $env:RELEASE_TAG @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
